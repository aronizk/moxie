<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ticketin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1F3B;
    --ink-soft:#4A4F73;
    --paper:#FFFFFF;
    --gold:#E8A33D;
    --coral:#D6455D;
    --coral-dark:#B23349;
    --teal:#2F9C95;
    --line:#DCD5C3;
    --radius:14px;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#F1ECE1; }
  #app-root{
    font-family:'Noto Sans JP','Zen Maru Gothic',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    max-width:480px;
    margin:0 auto;
    border-left:1px solid var(--line);
    border-right:1px solid var(--line);
    position:relative;
    padding-bottom:40px;
  }
  @media (min-width:700px){
    #app-root{ max-width:1400px; width:100%; border-left:none; border-right:none; }
  }
  .mono{ font-family:'JetBrains Mono',monospace; }
  .display{ font-family:'Zen Maru Gothic','Noto Sans JP',sans-serif; }

  .app-header{
    padding:12px 14px 10px;
    background:#FFFFFF; border-bottom:1px solid var(--line);
  }
  .app-header-top{ display:flex; align-items:center; gap:8px; min-height:32px; }
  .logo-slot{ display:flex; align-items:center; height:32px; }
  .logo-slot img{ height:32px; width:auto; max-width:120px; object-fit:contain; border-radius:4px; }
  .logo-placeholder{
    display:none; align-items:center; justify-content:center;
    height:32px; width:88px; border:1.5px dashed #C7C2D8; border-radius:6px;
    color:#9B96AE; font-size:10px; font-weight:700; letter-spacing:1px;
  }
  .header-spacer{ flex:1; }
  .header-search{ display:flex; gap:6px; margin-top:10px; }
  .header-search input{ flex:1; padding:8px 10px; border-radius:8px; border:1.5px solid var(--line); font-size:12.5px; font-family:inherit; }
  .header-search button{
    background:var(--coral); color:#fff; border:none; border-radius:8px; padding:8px 14px;
    font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; flex-shrink:0;
  }
  .header-nav-links{ display:flex; justify-content:flex-end; gap:14px; margin-top:8px; flex-wrap:wrap; }
  .header-link{ font-size:11px; color:var(--ink-soft); cursor:pointer; font-weight:600; }
  .header-link:hover{ color:var(--coral-dark); }
  @media (min-width:700px){
    .app-header{ display:flex; align-items:center; gap:16px; max-width:1100px; margin:0 auto; }
    .app-header-top{ min-height:auto; }
    .header-search{ margin-top:0; flex:1; max-width:340px; }
    .header-nav-links{ margin-top:0; flex-wrap:nowrap; }
  }
  .lang-toggle{
    display:flex; border:1.5px solid var(--line); border-radius:20px; overflow:hidden;
    margin-left:8px; flex-shrink:0;
  }
  .lang-toggle button{
    border:none; background:transparent; color:var(--ink-soft); font-size:10.5px; font-weight:700;
    padding:4px 9px; cursor:pointer; font-family:inherit;
  }
  .lang-toggle button.active{ background:var(--coral); color:#fff; }

  .disclaimer{
    background:#FBEDEF; color:#B23349; font-size:11px; line-height:1.5; text-align:center;
    padding:9px 14px; border-bottom:none;
  }

  .promo-banner-slot{ margin:12px 14px 0; }
  .promo-banner-slot img{ width:100%; height:auto; aspect-ratio:5/1; object-fit:cover; object-position:center; display:block; border-radius:var(--radius); }
  .promo-banner{
    border-radius:var(--radius);
    background:linear-gradient(120deg, var(--coral), var(--coral-dark));
    color:#fff; padding:14px 16px; align-items:center; justify-content:space-between;
    box-shadow:0 4px 10px rgba(214,69,93,.25);
  }
  .promo-banner .big{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px; line-height:1.3;}
  .promo-banner .sub{ font-size:10px; opacity:.9; margin-top:2px;}
  .promo-banner .pct{ font-size:26px; font-weight:800; font-family:'Zen Maru Gothic';}

  .tabs{ display:flex; margin:14px 14px 0; background:#fff; border-radius:10px; overflow:hidden; border:1px solid var(--line); }
  .tab{ flex:1; text-align:center; padding:9px 4px; font-size:12.5px; cursor:pointer; color:var(--ink-soft); font-weight:600; user-select:none; }
  .tab.active{ background:var(--coral); color:#fff; }

  .content{ padding:14px; }
  @media (min-width:700px){
    .content{ max-width:900px; margin:0 auto; padding:24px 20px; }
    .content.content--home{ max-width:1100px; }
  }
  .ticket-grid{ display:block; }
  @media (min-width:700px){
    .ticket-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 320px)); gap:16px; justify-content:start; }
  }

  .home-layout{ display:block; }
  .home-sidebar{ display:none; }
  @media (min-width:900px){
    .home-layout{ display:grid; grid-template-columns:220px 1fr; gap:28px; align-items:start; }
    .home-sidebar{ display:block; position:sticky; top:16px; }
    .home-narrow{ max-width:none !important; }
  }
  .sidebar-section{ margin-bottom:22px; }
  .sidebar-title{ font-size:11px; font-weight:700; color:var(--coral-dark); margin-bottom:8px; letter-spacing:.5px; }
  .sidebar-link{ font-size:13px; color:var(--ink-soft); padding:6px 0; cursor:pointer; font-weight:600; }
  .sidebar-link:hover{ color:var(--coral-dark); }

  .ranking-list{ background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:8px; }
  .ranking-item{ display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .ranking-item:last-child{ border-bottom:none; }
  .ranking-item:hover{ background:#FBF8F2; }
  .ranking-num{ font-weight:800; color:var(--gold); font-size:14px; width:18px; flex-shrink:0; }
  .ranking-title{ flex:1; font-size:13px; color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ranking-arrow{ color:var(--ink-soft); flex-shrink:0; }

  .filter-tabs-box{ background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:16px; }
  .filter-tabs{ display:flex; border-bottom:1px solid var(--line); }
  .filter-tab{ flex:1; text-align:center; padding:12px 8px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; }
  .filter-tab.active{ color:var(--coral-dark); border-bottom-color:var(--coral-dark); }
  .filter-tab:hover{ background:#FBF8F2; }
  .listing-list{ }
  .listing-row{ display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); cursor:pointer; gap:10px; }
  .listing-row:last-child{ border-bottom:none; }
  .listing-row:hover{ background:#FBF8F2; }
  .listing-row-main{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .listing-row-title{ font-size:13.5px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .listing-row-date{ font-size:11.5px; color:var(--ink-soft); }
  .listing-row-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .listing-row-price{ font-size:14px; font-weight:800; color:var(--coral-dark); }
  .listing-row-arrow{ color:var(--ink-soft); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:none; border-radius:10px; padding:11px 16px; font-size:13.5px;
    font-weight:700; cursor:pointer; width:100%; font-family:inherit;
  }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--coral); color:#fff; }
  .btn-primary:hover{ background:var(--coral-dark); }
  .btn-dark{ background:var(--ink); color:var(--gold); }
  .btn-outline{ background:#fff; color:var(--ink); border:1.5px solid var(--line); }
  .btn-gold{ background:var(--gold); color:var(--ink); }
  .btn-danger{ background:#fff; color:var(--coral-dark); border:1.5px solid var(--coral); }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-sm{ padding:7px 10px; font-size:12px; width:auto; border-radius:8px; }
  .row-btns{ display:flex; gap:8px; }
  .row-btns .btn{ flex:1; }

  .card{ background:#fff; border-radius:var(--radius); border:1px solid var(--line); padding:14px; margin-bottom:12px; }
  .ticket-stub{ position:relative; background:#fff; border-radius:16px; margin-bottom:14px; box-shadow:0 2px 8px rgba(27,31,59,.08); overflow:hidden; cursor:pointer; }
  .stub-top{ padding:14px 16px 10px; }
  .stub-perf{ position:relative; height:0; border-top:2px dashed var(--line); }
  .stub-perf::before, .stub-perf::after{ content:''; position:absolute; top:-9px; width:18px; height:18px; background:#F1ECE1; border-radius:50%; }
  .stub-perf::before{ left:-9px; }
  .stub-perf::after{ right:-9px; }
  .stub-bottom{ padding:10px 16px 14px; }
  .stub-title{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:15px; color:var(--ink); }
  .stub-meta{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }
  .stub-price{ font-family:'JetBrains Mono'; font-weight:700; color:var(--coral-dark); font-size:16px; }
  .status-pill{ display:inline-block; font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; background:var(--teal); color:#fff; }
  .status-pill.sold{ background:var(--ink-soft); }
  .status-pill.cancel{ background:#999; }

  label{ display:block; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin:12px 0 4px; }
  label .hint{ font-weight:400; color:#999; font-size:10.5px; }
  input[type=text], input[type=number], input[type=password], input[type=email], select, textarea{
    width:100%; padding:9px 10px; border-radius:8px; border:1.5px solid var(--line);
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink);
  }
  textarea{ resize:vertical; min-height:60px; }
  .section-label{ font-family:'Zen Maru Gothic'; font-weight:700; font-size:13px; color:var(--ink); margin:18px 0 4px; padding-bottom:6px; border-bottom:2px solid var(--gold); }
  .total-box{ background:var(--ink); color:#fff; border-radius:10px; padding:12px 14px; margin-top:14px; }
  .total-box .label{ font-size:10.5px; color:#C9CCE3; }
  .total-box .amount{ font-family:'JetBrains Mono'; font-size:22px; font-weight:700; color:var(--gold); }

  .escrow-banner{ background:#FFF4E0; border:1.5px solid var(--gold); border-radius:10px; padding:12px; font-size:11.5px; line-height:1.6; color:#6B4A12; margin-bottom:14px; }
  .escrow-banner b{ color:var(--coral-dark); }

  .link-box{ display:flex; gap:6px; align-items:center; background:#fff; border:1.5px dashed var(--gold); border-radius:10px; padding:8px 10px; margin-top:10px; }
  .link-box input{ border:none; font-size:11px; padding:2px; flex:1; }

  .msg{ max-width:78%; padding:8px 11px; border-radius:12px; font-size:12.5px; margin-bottom:8px; line-height:1.4;}
  .msg.mine{ background:var(--coral); color:#fff; margin-left:auto; border-bottom-right-radius:2px;}
  .msg.theirs{ background:#fff; border:1px solid var(--line); border-bottom-left-radius:2px;}
  .msg .who{ font-size:9.5px; opacity:.7; margin-bottom:2px; display:block; font-weight:700;}

  .empty{ text-align:center; padding:40px 20px; color:#999; font-size:12.5px; }
  .back-row{ display:flex; align-items:center; gap:8px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); color:var(--ink) !important; font-weight:700; cursor:pointer; text-decoration:none !important; }
  .back-row, .back-row *{ text-decoration:none !important; }
  .back-row svg{ width:18px; height:18px; }
  .small{ font-size:11px; color:var(--ink-soft); }
  .error-text{ font-size:11.5px; color:var(--coral-dark); margin-top:6px; }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px; font-size:12.5px; z-index:999; box-shadow:0 4px 14px rgba(0,0,0,.2); }
  .fee-line{ display:flex; justify-content:space-between; font-size:12px; padding:3px 0; color:var(--ink-soft); }
  .fee-line.total{ color:var(--ink); font-weight:700; font-size:14px; border-top:1px dashed var(--line); margin-top:6px; padding-top:8px;}
  .thumb{ max-width:100%; border-radius:8px; margin-top:8px; border:1px solid var(--line); }
  a.plain{ color:var(--coral-dark); font-weight:700; text-decoration:none; }
  .link-toggle{ text-align:center; margin-top:14px; font-size:12px; color:var(--ink-soft); cursor:pointer; }
  .link-toggle b{ color:var(--coral-dark); }
  .spinner{ text-align:center; padding:30px; color:#999; font-size:12px; }
  .stat-row{ display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:10px; border-top:1px solid var(--line); }
  .stat-item{ display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; min-width:36px; }
  .stat-report{ flex-direction:row; gap:4px; cursor:pointer; }
  .stat-icon-svg{ width:17px; height:17px; color:#AEB3C7; }
  .stat-caption{ font-size:10.5px; color:#9BA0B8; }
  .stat-num{ font-size:11px; color:#9BA0B8; font-weight:700; }
  .stat-report .stat-caption{ font-size:10.5px; }

  .back-row-share{ position:relative; display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  .share-icon{ color:var(--coral); cursor:pointer; padding:4px; }
  .share-icon svg{ width:20px; height:20px; }

  .bottom-nav{
    display:flex; border-top:1px solid var(--line); background:#fff;
    margin-top:16px; padding:6px 4px 8px;
  }
  @media (min-width:900px){
    .bottom-nav{ display:none; }
  }
  .bnav-item{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer; padding:4px 2px; }
  .bnav-icon-svg{ width:20px; height:20px; color:#B7BBD1; }
  .bnav-label{ font-size:9.5px; color:#B7BBD1; }
  .bnav-item.active .bnav-icon-svg, .bnav-item.active .bnav-label{ color:var(--coral); }


  .qty-order-row{ display:flex; align-items:flex-end; gap:10px; }
  .qty-order-row > div:first-child{ flex-shrink:0; width:110px; }
  .qty-order-row select{ margin:0; }
  .qty-order-row .btn{ flex:1; width:auto; }

  .plain-panel{ padding:0 0 4px; }
  .detail-row{ padding:11px 0; border-bottom:1px solid var(--line); }
  .panel-divider{ border-top:1px solid var(--line); margin:20px 0 24px; }
</style>
</head>

  let lang = localStorage.getItem('ticketin_lang') || 'ja';
  function t(key, vars){
    let s = (I18N[lang] && I18N[lang][key]) ?? I18N.ja[key] ?? key;
    if(vars){ Object.keys(vars).forEach(k => { s = s.replace('{'+k+'}', vars[k]); }); }
    return s;
  }
  function setLang(l){
    lang = l;
    localStorage.setItem('ticketin_lang', l);
    render();
  }

  // Maps stored DB enum values (always Japanese) to the current display language.
  function ticketStatusLabel(status){
    const map = { '販売中':'status_on_sale', '売却済':'status_sold', '取消':'status_cancelled' };
    return map[status] ? t(map[status]) : status;
  }
  function paymentMethodLabel(method){
    const map = { 'マニュアル送金':'pm_manual', 'PayPay':'pm_paypay', '銀行振込':'pm_bank' };
    return map[method] ? t(map[method]) : method;
  }

  // API base: same-origin '/api' by default (works when this file is served by the
  // ticketin backend itself). Override for local dev by opening with ?api=http://localhost:4000/api
  const params = new URLSearchParams(location.search);
  const API_BASE = params.get('api') || '/api';
  const FEE_RATE = 0.10;

  let session = loadSession(); // { token, user: {id, username, isAdmin} } | null
  let searchQuery = '';
  let listFilter = 'all'; // 'all' | 'cheap' | 'soon'

  function loadSession(){
    try{
      const raw = localStorage.getItem('ticketin_session');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveSession(s){
    session = s;
    if(s) localStorage.setItem('ticketin_session', JSON.stringify(s));
    else localStorage.removeItem('ticketin_session');
  }

  // Guest orders (placed without an account) are tracked via a private token stored per
  // order id, sent as the X-Guest-Token header so the server can verify ownership.
  function getGuestToken(orderId){
    try{ return localStorage.getItem('ticketin_guest_token:'+orderId); }catch(e){ return null; }
  }
  function saveGuestToken(orderId, token){
    try{ localStorage.setItem('ticketin_guest_token:'+orderId, token); }catch(e){ /* ignore */ }
  }
  function clearGuestToken(orderId){
    try{ localStorage.removeItem('ticketin_guest_token:'+orderId); }catch(e){ /* ignore */ }
  }

  async function api(path, { method='GET', body, isForm=false, guestOrderId=null } = {}){
    const headers = {};
    if(session) headers['Authorization'] = 'Bearer ' + session.token;
    if(guestOrderId){
      const gt = getGuestToken(guestOrderId);
      if(gt) headers['X-Guest-Token'] = gt;
    }
    if(!isForm && body !== undefined) headers['Content-Type'] = 'application/json';

    const res = await fetch(API_BASE + path, {
      method,
      headers,
      body: isForm ? body : (body !== undefined ? JSON.stringify(body) : undefined),
    });

    let data = null;
    try{ data = await res.json(); }catch(e){ /* no body */ }

    if(!res.ok){
      if(res.status === 401 && session){ saveSession(null); }
      const err = new Error((data && data.error) || `Request failed (${res.status})`);
      err.status = res.status;
      err.details = data && data.details;
      throw err;
    }
    return data;
  }

  function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
  function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }
  function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function parseScheduleDate(schedule){
    if(!schedule) return null;
    const m = String(schedule).match(/(\d{4})\/(\d{1,2})\/(\d{1,2}).*?(\d{1,2}):(\d{2})/);
    if(!m) return null;
    const d = new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5]);
    return isNaN(d.getTime()) ? null : d;
  }

  let toastTimer=null;
  function toast(msg){
    let el = document.querySelector('.toast');
    if(el) el.remove();
    el = document.createElement('div'); el.className='toast'; el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.remove(), 2600);
  }

  function go(name, params){ view = Object.assign({name}, params||{}); render(); window.scrollTo(0,0); }

  function parseHash(){
    const h = location.hash.replace('#','');
    if(h.startsWith('ticket=')) return { name:'order', id: h.split('=')[1] };
    return null;

  function backRowWithShare(label, target, ticketId){
    return `<div class="back-row-share">
      <div class="back-row" data-go="${target}" style="margin-bottom:0; padding-bottom:0; border-bottom:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        ${label}
      </div>
      <div class="share-icon" data-action="copy-link" data-id="${ticketId}" title="${t('share_title')}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12M7 8l5-5 5 5M5 21h14"/></svg>
      </div>
      <input type="text" readonly value="${shareLink(ticketId)}" id="link-header-${ticketId}" style="position:absolute; opacity:0; pointer-events:none; width:1px;">

  const BNAV_ICONS = {
    home: '<path d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10"/>',
    watch: '<path d="M12 3.5l2.6 5.7 6.2.6-4.7 4.2 1.3 6.1L12 17l-5.4 3 1.3-6.1L3.2 9.8l6.2-.6z"/>',
    create: '<path d="M4 8a2 2 0 000 4 2 2 0 000 4h16a2 2 0 000-4 2 2 0 000-4H4z"/><line x1="14" y1="7.5" x2="14" y2="17.5" stroke-dasharray="2 2"/>',
    search: '<circle cx="10" cy="10" r="6"/><line x1="20.5" y1="20.5" x2="14.5" y2="14.5"/>',
    mission: '<path d="M6 3h12l4 6-10 12L2 9z"/>',
    mypage: '<circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-6 8-6s8 1.6 8 6"/>',
  };

  function bottomNavTabs(){
    return [
      { key:'home', label:t('nav_home'), real:true },
      { key:'watch', label:t('nav_watch'), real:false },
      { key:'create', label:t('nav_create'), real:true },
      { key:'search', label:t('nav_search'), real:true },
      { key:'mission', label:t('nav_mission'), real:false },
      { key:'mypage', label:t('nav_mypage'), real:true },
    ];
  }

  function bottomNav(activeKey){
    return `<div class="bottom-nav">
      ${bottomNavTabs().map(tb=>`
        <div class="bnav-item ${activeKey===tb.key?'active':''}" data-action="bnav-${tb.key}">
          <svg class="bnav-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${BNAV_ICONS[tb.key]}</svg>
          <span class="bnav-label">${tb.label}</span>
        </div>`).join('')}
    </div>`;
  }

  function activeNavKeyFor(viewName){
    if(viewName==='home') return 'home';
    if(viewName==='mytickets') return 'mypage';
    if(viewName==='create' || viewName==='edit') return 'create';
    return '';
  }

  async function render(){
    let html = header();
    // Public ticket links work without login; everything else requires a session.
    const publicViews = ['order','login','checkoutpreview','checkout','guide'];
    if(!session && !publicViews.includes(view.name)){
      view = {name:'login', next: view};
    }
    try{
      switch(view.name){
        case 'login': html += await screenLogin(); break;
        case 'home': html += await screenHome(); break;
        case 'create': html += await screenCreate(); break;
        case 'mytickets': html += await screenMyTickets(); break;
        case 'edit': html += await screenCreate(view.id); break;
        case 'ticketdetail': html += await screenTicketDetail(view.id); break;
        case 'order': html += await screenOrder(view.id); break;
        case 'checkoutpreview': html += await screenCheckoutPreview(view.id, view.qty); break;
        case 'checkout': html += await screenCheckout(view.id, view.orderId); break;
        case 'complaint': html += await screenComplaint(view.id, view.orderId); break;
        case 'conversation': html += await screenConversation(view.id); break;
        case 'admin': html += session && session.user.isAdmin ? await screenAdminPanel() : `<div class="content empty">${t('admin_required')}</div>`; break;
        case 'guide': html += screenGuide(); break;
        default: html += `<div class="content empty">${t('not_found_page')}</div>`;
      }
    }catch(err){
      html += `<div class="content"><div class="card"><div class="error-text">${esc(err.message)}</div></div></div>`;
    }
    if(view.name !== 'login'){
      html += bottomNav(activeNavKeyFor(view.name));
    }
    root.innerHTML = html;
    bindEvents();
  }

  // ---------- LOGIN / REGISTER ----------
  async function screenLogin(){
    const mode = view.mode || 'login';
    return `<div class="content">
      <div class="card" style="text-align:center; padding:26px 18px;">
        <div class="display" style="font-size:16px; font-weight:700; margin-bottom:6px;">${mode==='login'?t('login_title'):t('register_title')}</div>
        <div class="small" style="margin-bottom:16px;">${mode==='login'?t('login_subtitle'):t('register_subtitle')}</div>
        <input type="text" id="auth-username" placeholder="${t('username_placeholder')}" style="margin-bottom:10px;" autocomplete="username">
        <input type="password" id="auth-password" placeholder="${t('password_placeholder')}" style="margin-bottom:10px;" autocomplete="${mode==='login'?'current-password':'new-password'}">
        <div id="auth-error" class="error-text"></div>
        <button class="btn btn-primary" data-action="do-auth" data-mode="${mode}">${mode==='login'?t('login_btn'):t('register_btn')}</button>
        <div class="link-toggle" data-action="toggle-auth-mode" data-mode="${mode==='login'?'register':'login'}">
          ${mode==='login' ? `${t('no_account')} <b>${t('create_one')}</b>` : `${t('have_account')} <b>${t('login_link')}</b>`}
        </div>
      </div>
    </div>`;
  }

  // ---------- HOME ----------
  async function screenHome(){
    const { tickets: allTickets } = await api('/tickets');
    const q = searchQuery.trim().toLowerCase();
    const tickets = q
      ? allTickets.filter(tk => (tk.title||'').toLowerCase().includes(q) || (tk.artist||'').toLowerCase().includes(q) || (tk.place||'').toLowerCase().includes(q))
      : allTickets;
    const now = new Date();
    const soonCutoff = new Date(now.getTime() + 14*24*60*60*1000);
    let filteredTickets = tickets;
    if(listFilter === 'cheap'){
      filteredTickets = tickets.filter(tk => (tk.pricePerSheet||0) <= 2000);
    } else if(listFilter === 'soon'){
      filteredTickets = tickets
        .map(tk => ({tk, d: parseScheduleDate(tk.schedule)}))
        .filter(x => x.d && x.d >= now && x.d <= soonCutoff)
        .sort((a,b)=>a.d-b.d)
        .map(x=>x.tk);
    }
    const ranked = [...allTickets].sort((a,b)=>(b.viewCount||0)-(a.viewCount||0)).slice(0,5);
    return `<div class="content content--home">

      ${isBuyer ? `
      <button class="btn ${o.status==='completed'?'btn-outline':'btn-teal'}" style="margin-top:12px;"
        data-action="confirm-receipt" data-order="${orderId}" data-id="${ticketId}" ${o.status==='completed'?'disabled':''}>
        ${o.status==='completed' ? t('receipt_confirmed_btn') : t('confirm_receipt_btn')}
      </button>
      <div class="small" style="margin-top:6px; text-align:center;">${t('confirm_receipt_note')}</div>
      ` : ''}
    </div>`;
  }

  function statusLabel(s){
    return { pending:t('status_pending'), awaiting_confirmation:t('status_awaiting'), completed:t('status_completed'), disputed:t('status_disputed') }[s] || s;
  }

  // ---------- COMPLAINT ----------
  async function screenComplaint(ticketId, orderId){
    return `<div class="content">
      ${backRow(t('complaint_title'), 'checkout', ticketId, orderId)}
      <div class="card">
        <div class="small" style="margin-bottom:10px;">${t('complaint_intro')}</div>
        <label>${t('content_label')}</label>
        <textarea id="complaint-text" placeholder="${t('complaint_placeholder')}"></textarea>
        <div id="complaint-error" class="error-text"></div>
        <button class="btn btn-primary" style="margin-top:12px;" data-action="submit-complaint" data-order="${orderId}" data-id="${ticketId}">${t('send_btn')}</button>
      </div>
    </div>`;
  }

  // ---------- CONVERSATION ----------
  async function screenConversation(ticketId){
    const [{ ticket: tk }, { messages }] = await Promise.all([
      api('/tickets/'+ticketId),
      api(`/tickets/${ticketId}/conversation`).catch(()=>({messages:[]})),
    ]);
    const mine = tk.sellerId === session.user.id;
    return `<div class="content">
      ${backRow(t('conversation_title') + tk.title, session.user.isAdmin && !mine ? 'admin' : (mine?'mytickets':'order'), ticketId)}
      <div class="card" style="max-height:340px; overflow-y:auto;" id="conv-box">
        ${messages.length? messages.map(m=>`
          <div class="msg ${m.sender_id===session.user.id?'mine':'theirs'}">
            <span class="who">${esc(m.sender_username)}</span>${esc(m.body)}
          </div>`).join('') : `<div class="empty">${t('no_messages')}</div>`}
      </div>
      ${!session.user.isAdmin ? `
      <div style="display:flex; gap:8px; margin-top:10px;">
        <input type="text" id="msg-input" placeholder="${t('message_placeholder')}">
        <button class="btn btn-primary btn-sm" data-action="send-msg" data-id="${ticketId}">${t('send_short')}</button>
      </div>` : `<div class="small" style="margin-top:8px;">${t('admin_view_only')}</div>`}
    </div>`;
  }

  // ---------- ADMIN ----------
  async function screenAdminPanel(){
    const adminTab = view.adminTab || 'tickets';
    const [{ tickets }, { complaints }, { reports }, { users }] = await Promise.all([
      api('/admin/tickets'),
      api('/admin/complaints').catch(()=>({complaints:[]})),
      api('/admin/reports').catch(()=>({reports:[]})),
      api('/admin/users').catch(()=>({users:[]})),
    ]);
    const complaintsByOrder = {};
    complaints.forEach(c => { (complaintsByOrder[c.order_id] ||= []).push(c); });
    const reportsByTicket = {};
    reports.forEach(r => { (reportsByTicket[r.ticket_id] ||= []).push(r); });

    let rows = '';
    for(const tk of tickets){
      rows += `
      <div class="card">
        <div class="stub-title">${esc(tk.title)}</div>
        <div class="small">${esc(ticketStatusLabel(tk.status))} ・ ${yen(tk.pricePerSheet)}</div>
        ${(reportsByTicket[tk.id]||[]).map(r=>`<div style="color:var(--coral-dark); font-weight:700; font-size:12px; margin-top:6px;">🚩 ${t('report_label')} (${esc(r.reported_by_username)}): ${esc(r.body)}</div>`).join('')}
        <div class="row-btns" style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" data-go="edit" data-id="${tk.id}">${t('edit_btn')}</button>
          <button class="btn btn-outline btn-sm" data-go="conversation" data-id="${tk.id}">${t('view_conv_btn')}</button>
          <button class="btn btn-danger btn-sm" data-action="admin-delete-ticket" data-id="${tk.id}">${t('delete_btn')}</button>
        </div>
        ${tk.orders.length? `<div class="small" style="margin-top:10px; font-weight:700;">${t('order_list_label')}</div>` + tk.orders.map(o=>`
          <div style="border-top:1px solid var(--line); padding-top:8px; margin-top:8px; font-size:12px;">
            ${t('buyer_label')}: ${esc(o.buyerUsername)} ・ ${o.quantity}${t('qty_unit')} ・ ${yen(o.total)} ・ ${statusLabel(o.status)}
            ${(complaintsByOrder[o.id]||[]).map(c=>`<div style="color:var(--coral-dark); font-weight:700;">⚠ ${esc(c.body)}</div>`).join('')}
            ${o.hasPaymentProof ? `<br><a class="plain" href="#" data-action="admin-download-proof" data-order="${o.id}">${t('download_proof_btn')}</a>` : `<div class="small">${t('proof_not_submitted')}</div>`}
          </div>
        `).join('') : `<div class="small" style="margin-top:8px;">${t('no_orders_yet')}</div>`}
      </div>`;
    }

    let userRows = users.map(u => `
      <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div class="stub-title" style="font-size:13.5px;">${esc(u.username)}${u.is_admin? ' 👑':''}</div>
            <div class="small">${t('created_label')}: ${new Date(u.created_at).toLocaleDateString()}</div>
          </div>
        </div>
        <div class="row-btns" style="margin-top:10px;">
          <button class="btn btn-outline btn-sm" data-action="toggle-admin" data-id="${u.id}" data-current="${u.is_admin}">${u.is_admin? t('demote_btn') : t('promote_btn')}</button>
          <button class="btn btn-danger btn-sm" data-action="delete-user" data-id="${u.id}">${t('delete_btn')}</button>
        </div>
      </div>`).join('');

    return `<div class="content">
      ${backRow(t('admin_panel_title'),'home')}
      <div class="tabs">
        <div class="tab ${adminTab==='tickets'?'active':''}" data-action="admin-tab" data-tab="tickets">${t('all_tickets_orders')}</div>
        <div class="tab ${adminTab==='users'?'active':''}" data-action="admin-tab" data-tab="users">${t('user_management')}</div>
      </div>
      ${adminTab==='tickets' ? `
      <div class="section-label" style="margin-top:16px;">${t('all_tickets_orders')}</div>
      ${rows || `<div class="empty">${t('no_tickets_yet')}</div>`}
      ` : `
      <div class="card" style="margin-top:16px;">
        <div class="section-label" style="margin-top:0;">${t('create_user_title')}</div>
        <label>${t('username_placeholder')}</label>
        <input type="text" id="new-user-username" placeholder="${t('username_placeholder')}">
        <label>${t('password_placeholder')}</label>
        <input type="password" id="new-user-password" placeholder="${t('password_placeholder')}">
        <label style="display:flex; align-items:center; gap:6px; margin-top:10px;">
          <input type="checkbox" id="new-user-admin" style="width:auto;"> ${t('make_admin_label')}
        </label>
        <div id="create-user-error" class="error-text"></div>
        <button class="btn btn-primary" style="margin-top:10px;" data-action="create-user">${t('create_user_btn')}</button>
      </div>
      <div class="section-label">${t('all_users_heading')}</div>
      ${userRows || `<div class="empty">${t('no_users_yet')}</div>`}
      `}
    </div>`;
  }

  // ---------- EVENTS ----------
  function bindEvents(){
    root.querySelectorAll('[data-go]').forEach(el=>{
      el.addEventListener('click', ()=>{
        go(el.getAttribute('data-go'), { id: el.getAttribute('data-id'), orderId: el.getAttribute('data-order') });
      });
    });

    const searchInput = root.querySelector('#header-search-input');
    if(searchInput){
      searchInput.addEventListener('keydown', (e)=>{
        if(e.key === 'Enter'){
          searchQuery = searchInput.value;
          go('home');
        }
      });
    }

    const form = root.querySelector('#ticket-form');
    if(form){
      const priceEl = form.querySelector('[name=pricePerSheet]');
      const qtyEl = form.querySelector('[name=quantity]');
      const updateTotal = ()=>{
        const p = parseFloat(priceEl.value)||0, q = parseFloat(qtyEl.value)||0;
        root.querySelector('#live-total').textContent = yen(p*q);
      };
      priceEl.addEventListener('input', updateTotal);
      qtyEl.addEventListener('input', updateTotal);

      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const fd = new FormData(form);
        const editId = form.getAttribute('data-edit-id');
        const payload = {
          title: fd.get('title'), artist: fd.get('artist'), status: fd.get('status'),
          schedule: fd.get('schedule'), place: fd.get('place'),
          seatPosition: fd.get('seatPosition'), ticketType: fd.get('ticketType'),
          pricePerSheet: parseFloat(fd.get('pricePerSheet'))||0,
          quantity: parseInt(fd.get('quantity'))||1,
          sellerNote: fd.get('sellerNote'), reviewCount: parseInt(fd.get('reviewCount'))||0,
          favoriteCount: parseInt(fd.get('favoriteCount'))||0,
          nameType: fd.get('nameType'), issueStatus: fd.get('issueStatus'),
          deliveryMethod: fd.get('deliveryMethod'), deliveryPeriod: fd.get('deliveryPeriod'),
          paymentMethod: fd.get('paymentMethod'), transferTarget: fd.get('transferTarget'),
          bankName: fd.get('bankName'), bankBranch: fd.get('bankBranch'),
          bankType: fd.get('bankType'), bankNumber: fd.get('bankNumber'), bankHolder: fd.get('bankHolder'),
          instructions: fd.get('instructions'), notes: fd.get('notes'),
        };
        try{
          const result = editId
            ? await api('/tickets/'+editId, { method:'PUT', body: payload })
            : await api('/tickets', { method:'POST', body: payload });
          toast(editId? t('ticket_updated_toast') : t('ticket_created_toast'));
          go('ticketdetail', { id: result.ticket.id });
        }catch(err){
          root.querySelector('#form-error').textContent = err.message;
        }
      });
    }

    root.querySelectorAll('[data-action]').forEach(el=>{
      el.addEventListener('click', async (ev)=>{
        ev.preventDefault();
        const action = el.getAttribute('data-action');
        const id = el.getAttribute('data-id');
        const orderId = el.getAttribute('data-order');

        if(action==='set-lang'){ setLang(el.getAttribute('data-lang')); }

        if(action==='header-search'){
          const val = root.querySelector('#header-search-input').value;
          searchQuery = val;
          go('home');
        }

        if(action==='clear-search'){
          searchQuery = '';
          go('home');
        }

        if(action==='sidebar-search'){
          searchQuery = el.getAttribute('data-kw') || '';
          go('home');
        }

        if(action==='set-list-filter'){
          listFilter = el.getAttribute('data-filter') || 'all';
          go('home');
        }

        if(action==='header-goto-register'){ go('login', { mode:'register' }); }
        if(action==='header-goto-login'){ go('login', { mode:'login' }); }

        if(action==='toggle-auth-mode'){ go('login', { mode: el.getAttribute('data-mode') }); }

        if(action==='header-user-click' && session){
          if(confirm(t('logout_confirm'))){ saveSession(null); go('login'); }
        }

        if(action==='do-auth'){
          const mode = el.getAttribute('data-mode');
          const username = root.querySelector('#auth-username').value.trim();
          const password = root.querySelector('#auth-password').value;
          const errBox = root.querySelector('#auth-error');
          errBox.textContent = '';
          try{
            const result = await api('/auth/'+mode, { method:'POST', body:{ username, password } });
            saveSession(result);
            toast(mode==='login' ? t('logged_in_toast') : t('account_created_toast'));
            const next = view.next && view.next.name !== 'login' ? view.next : {name:'home'};

            // If we were on a guest order and just logged in, attach it to the new account.
            if(next.orderId && getGuestToken(next.orderId)){
              try{
                await api(`/orders/${next.orderId}/claim`, { method:'POST', guestOrderId: next.orderId });
                clearGuestToken(next.orderId);
                toast(t('order_claimed_toast'));
              }catch(claimErr){ /* already claimed or not applicable — safe to ignore */ }
            }

            go(next.name, next);
          }catch(err){
            errBox.textContent = err.message;
          }
        }

        if(action==='copy-link'){
          const input = root.querySelector('#link-'+id) || root.querySelector('#link-header-'+id);
          if(!input){ toast(t('link_error_toast')); return; }
          input.select(); input.setSelectionRange(0,9999);
          try{ await navigator.clipboard.writeText(input.value); toast(t('link_copied_toast')); }
          catch(e){ document.execCommand('copy'); toast(t('link_copied_toast')); }
        }

        if(action==='delete-ticket' || action==='admin-delete-ticket'){
          if(!confirm(t('confirm_delete_ticket'))) return;
          try{
            const path = action==='admin-delete-ticket' ? '/admin/tickets/'+id : '/tickets/'+id;
            await api(path, { method:'DELETE' });
            toast(t('deleted_toast'));
            go(session.user.isAdmin && action==='admin-delete-ticket' ? 'admin' : 'mytickets');
          }catch(err){ toast(err.message); }
        }

        if(action==='proceed-order'){
          const qty = parseInt(root.querySelector('#buy-qty').value);
          go('checkoutpreview', { id, qty });
        }

        if(action==='mark-paid'){
          const qty = el.getAttribute('data-qty');
          try{
            const { order } = await api(`/tickets/${id}/orders`, { method:'POST', body:{ quantity: parseInt(qty) } });
            if(order.guestToken) saveGuestToken(order.id, order.guestToken);
            go('checkout', { id, orderId: order.id });
          }catch(err){
            root.querySelector('#preview-error').textContent = err.message;
          }
        }

        if(action==='upload-proof'){
          const fileInput = root.querySelector('#proof-file');
          if(!fileInput.files.length){ toast(t('select_image_toast')); return; }
          const fd = new FormData();
          fd.append('file', fileInput.files[0]);
          try{
            await api(`/orders/${orderId}/payment-proof`, { method:'POST', body: fd, isForm:true, guestOrderId:orderId });
            toast(t('uploaded_toast'));
            render();
          }catch(err){ toast(err.message); }
        }

        if(action==='admin-download-proof'){
          try{
            const { url } = await api(`/admin/orders/${orderId}/payment-proof`);
            window.open(url, '_blank');
          }catch(err){ toast(err.message); }
        }

        if(action==='confirm-receipt'){
          if(!confirm(t('confirm_receipt_confirm'))) return;
          try{
            await api(`/orders/${orderId}/confirm-receipt`, { method:'POST', guestOrderId:orderId });
            toast(t('receipt_recorded_toast'));
            render();
          }catch(err){ toast(err.message); }
        }

        if(action==='guest-login'){
          go('login', { next: {name:'checkout', id, orderId} });
        }

        if(action==='submit-complaint'){
          const text = root.querySelector('#complaint-text').value.trim();
          if(!text){ root.querySelector('#complaint-error').textContent = t('complaint_required'); return; }
          if(!session){
            go('login', { next: {name:'complaint', id, orderId} });
            return;
          }
          try{
            await api(`/orders/${orderId}/complaint`, { method:'POST', body:{ body:text }, guestOrderId:orderId });
            toast(t('complaint_sent_toast'));
            go('checkout', { id, orderId });
          }catch(err){
            root.querySelector('#complaint-error').textContent = err.message;
          }
        }

        if(action==='send-msg'){
          const input = root.querySelector('#msg-input');
          const text = input.value.trim();
          if(!text) return;
          try{
            await api(`/tickets/${id}/conversation`, { method:'POST', body:{ body:text } });
            render();
          }catch(err){ toast(err.message); }
        }

        if(action==='report-ticket'){
          const reason = prompt(t('report_prompt'));
          if(!reason || !reason.trim()) return;
          try{
            await api(`/tickets/${id}/report`, { method:'POST', body:{ body: reason.trim() } });
            toast(t('report_sent_toast'));
          }catch(err){ toast(err.message); }
        }

        if(action==='admin-tab'){
          go('admin', { adminTab: el.getAttribute('data-tab') });
        }

        if(action==='create-user'){
          const username = root.querySelector('#new-user-username').value.trim();
          const password = root.querySelector('#new-user-password').value;
          const isAdmin = root.querySelector('#new-user-admin').checked;
          const errBox = root.querySelector('#create-user-error');
          errBox.textContent = '';
          try{
            await api('/admin/users', { method:'POST', body:{ username, password, isAdmin } });
            toast(t('user_created_toast'));
            go('admin', { adminTab:'users' });
          }catch(err){ errBox.textContent = err.message; }
        }

        if(action==='toggle-admin'){
          const makingAdmin = el.getAttribute('data-current') !== 'true';
          try{
            await api(`/admin/users/${id}`, { method:'PATCH', body:{ isAdmin: makingAdmin } });
            toast(makingAdmin ? t('promoted_toast') : t('demoted_toast'));
            go('admin', { adminTab:'users' });
          }catch(err){ toast(err.message); }
        }

        if(action==='delete-user'){
          if(!confirm(t('confirm_delete_user'))) return;
          try{
            await api(`/admin/users/${id}`, { method:'DELETE' });
            toast(t('user_deleted_toast'));
            go('admin', { adminTab:'users' });
          }catch(err){ toast(err.message); }
        }

        if(action==='bnav-home'){ go('home'); }
        if(action==='bnav-create'){ go('create'); }
        if(action==='bnav-search'){ go('home'); }
        if(action==='bnav-mypage'){ go('mytickets'); }
        if(action==='bnav-watch' || action==='bnav-mission'){
          toast(t('feature_coming_soon'));
        }
      });
    });
  }

  const deep = parseHash();
  if(deep) view = deep;
  render();
})();
</script>
</body>
</html>
